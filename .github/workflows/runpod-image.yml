name: RunPod worker image

# Builds the pinned SWADE Voice Engine worker (Dockerfile.runpod) and publishes it to
# ghcr.io/swadesoul/voicebox-runpod. Release by pushing a tag such as runpod-v1.
on:
  push:
    tags: ["runpod-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (the CUDA base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/swadesoul/voicebox-runpod:${{ github.ref_name }}
            ghcr.io/swadesoul/voicebox-runpod:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
