name: RunPod worker image

# Builds the SWADE Voice Engine for RunPod in two steps:
#   1. ghcr.io/swadesoul/voicebox-core  — this repo's Dockerfile (the Voicebox engine itself)
#   2. ghcr.io/swadesoul/voicebox-runpod — Dockerfile.runpod on top of step 1, pinned by digest
# Release by pushing a tag such as runpod-v1; point the RunPod template at that tag.
on:
  push:
    tags: ["runpod-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (CUDA torch and the TTS models' dependencies are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Voicebox engine (this repo's Dockerfile)
        id: core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/swadesoul/voicebox-core:${{ github.ref_name }}
            ghcr.io/swadesoul/voicebox-core:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build the RunPod worker on that exact engine digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/swadesoul/voicebox-core@${{ steps.core.outputs.digest }}
          tags: |
            ghcr.io/swadesoul/voicebox-runpod:${{ github.ref_name }}
            ghcr.io/swadesoul/voicebox-runpod:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
